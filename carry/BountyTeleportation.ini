; Bounty Teleportation for Crimson Desert, exe 1.0.0.2944, 1.0.0.2949 or 1.0.0.2976
;
; Catch a bounty target, open the map, travel. He goes with you, on your
; back, and is still yours to hand in at the other end.
;
; Put BountyTeleportation.asi and this file in bin64 next to CrimsonDesert.exe, with
; an ASI loader. If this file is not there the plugin writes it on the first
; run. BountyTeleportation.log turns up beside them and is about twenty lines long.
;
; Seven addresses are written or hooked and each one is checked against the
; bytes that should be there first. The plugin carries a set for each game
; build it knows and uses whichever one the game matches, so it works on
; 1.0.0.2944 and on the 1.0.0.2949 and 1.0.0.2976 patches. On a game update
; that matches none of them it writes nothing, hooks nothing, and says so in
; the log. Everything it wrote is put back if it is unloaded.

[settings]

; Keep hold of the catch through the teleport. Four places let go of one, and
; all four are skipped, but only from the moment a map teleport starts with
; you holding someone until that carry ends. The rest of the time the game
; releases catches as it always has, which is what petting an animal,
; putting away a note and a grab interrupted by a hit all depend on. 1.0.0
; skipped them for the whole session and left players stuck in all three.
; If you are ever stuck carrying nothing after a teleport, set this to 0,
; start the game once, and it clears.
;   0  off
;   1  on
KeepCatch=1

; Keep the man himself. Leaving a field removes every actor spawned in it,
; including him, unless something says it still holds him. This says so.
; Without KeepCatch it does nothing useful, because the release runs first
; and clears the flag it reads.
;   0  off
;   1  on
KeepCarried=1
