; Bounty Probe for Crimson Desert 2.03.00 (exe 1.0.0.2944)
;
; A research plugin. It watches the handlers that refuse a fast travel while
; you are carrying something, and the catch machinery that owns the thing you
; are carrying. It changes nothing unless Unblock is set to 1 below.
;
; Put BountyProbe.asi and this file in bin64 next to CrimsonDesert.exe, with an
; ASI loader. The log is BountyProbe.log next to the plugin, with the eleven
; previous sessions kept beside it.
;
; Three different functions raise eErrNoFieldMoveHolding, which is the error
; behind "Cannot teleport in the current state.", and nothing in the exe says
; which of them refuses a map teleport. The plugin finds all three at startup
; and hooks each, as fieldmove1, fieldmove2 and fieldmove3.
;
; Nothing in this file caps a log. Every call of every hooked function is
; written in full, with its dumps; the log for a five-minute session runs to
; tens of megabytes and that is the point of it.
;
; A session that picks a bounty target up is a trial, and its log is kept
; out of the numbered rotation: when the game closes, BountyProbe.log
; becomes BountyProbe.trial-MMDD-HHMM-pickup.log and stays there. Those are
; never rotated and never deleted, so they are yours to move or remove.
; Everything else keeps the old scheme, 24 numbered archives with the
; oldest dropped.
;
; What a session is for now. Sessions one to eight settled that the player
; is never refused a map teleport while carrying a live outlaw. The teleport
; goes and the outlaw is left behind. Session eight's log put the order of
; events on the table. At the map confirm the field-move handler runs for
; the outlaw, not the player, and four milliseconds later the outlaw has no
; field any more; three seconds after that the destination's reload begins;
; seven seconds after the confirm the same handler runs for the player. The
; reload never re-creates the player, so nothing that hangs off a spawn
; descriptor can bring the outlaw along; whatever moved the outlaw away at
; the confirm, and whatever moves the player, are the two calls the mod has
; to change.
;
; Session nine's logs (15:33 and 15:47) named the calls. The map teleport's
; server handler moves the player through the field-move wrapper, and the
; wrapper's own tail moves whatever the player is catching with the same
; request. Then the handler calls a virtual on the player's character-control
; component (+0x23290D0) that releases the catch; KeepCatch skips that. With
; it skipped (15:47) the outlaw arrived caught, and eight milliseconds later
; a second message handler removed him anyway: at every map confirm it tears
; down every actor the player's session spawned in the field it is leaving,
; and the outlaw is one of those. The 15:33 log had the same sweep on him;
; what looked like his re-placement at the destination was a new NPC at the
; same address. The sweep spares an actor that someone else still holds, and
; KeepCarried below makes it spare a carried one.
;
; Session ten's run (16:50) brought the outlaw through. The confirm moved
; the player, the wrapper's tail moved the outlaw with him four
; milliseconds later, the release was skipped, and sixteen milliseconds
; after the confirm the sweep asked about the outlaw and was told he is
; held. He stayed in the world, and for the next forty-four seconds the
; move path carried him with the player around the destination, 1,463
; times, until an ordinary release ended it. Both settings below are what
; did that; turning either off brings back one of the two earlier failures.
;
; The 16:57 run repeated it: confirm at 16:59:32.170, the outlaw kept
; fourteen milliseconds later, 787 carries at the destination.
;
; Session eleven found why he still arrived on the ground. A watchdog on
; the catch component, +0x20AE540, drops a catch that is no longer backed
; by the carry animation, and a teleport resets exactly those flags. It
; runs about six times a second on every catch component in the world, and
; a second after each arrival it cleared the player's, server and client
; together. KeepCatch now patches it too. The 18:41 run kept both sides
; agreeing for the whole thirty-nine seconds at the destination, and the
; 18:51 run after it carried him on the player's back the whole way: pickup
; at 18:51:44.165, the sweep told to keep him at 18:51:57.077, the catch
; still held thirty-one seconds later.
;
; That patch is the one to suspect if a catch anywhere starts behaving
; oddly. The other three only skip a release the teleport asked for; this
; one removes the game's cleanup for every catch in the world, so a pickup
; that breaks halfway can leave the state set with nothing to clear it.
; KeepCatch=0 turns all four off.
;
; On screen he was lying on the ground at the destination rather than on
; the player's back. The client never re-made the pair: the run held two
; catch_match calls, both at the pickup, and none after the teleport, while
; the server ran six recatch calls at the destination. The client's own
; catch_match came from +0xB5A6F0 at the pickup, which is where the next
; session starts.

[settings]

; Hook the handlers the plugin works out for itself at startup, and the
; predicate each one branches on. These are found from the name
; eErrNoFieldMoveHolding rather than from an address, so a game update does
; not silently point them at the wrong bytes.
;   0  only the [sites] and [resolve] sections below are hooked
;   1  those, plus the handlers
AutoSites=1

; Also hook what calls those handlers, up to four. Worth having for the first
; session, because which caller fires says which path a map teleport takes.
; Turn it off if the log is too busy.
HookCallers=1

; Also hook the call each refusal branch follows. Off, because session three
; showed the one on the .code handler hands back a FieldAttacherForActor and
; not an error code, so reading it as an error made all 533,705 of its calls
; look like refusals. It is not the predicate either: that is the comparison
; between the call and the jump, reading a local. With this on it logs per
; call and dumps what it returns, which is how to work out what that local is.
;   0  off
;   1  on
HookHoldCheck=0

; Sample the hold acquirer. The first handler asks +0x2BC4200 for a hold on
; the actor's field attachment and refuses when it does not get one; that
; wrapper calls +0x2BBF2C0, which decides from four things, and all four are
; single bytes once followed: a blocked byte on the sub-object, whether it
; holds a field at all, whether that field is still alive, and a flag byte
; on the actor (+0xC2, which is all the actor's virtual returns). This hooks
; the acquirer, reads those and the second gate's pointer chain after every
; call, and names which of the four refused. It runs for every actor with a
; transform component, so samples are kept per sub-object. What gets
; written: every refusal of a call from inside the field-move handler (that
; handler asks on every one of its 27,359 calls a session, so its successes
; are only counted), and every sub-object that had the hold and lost it, or
; got it back, as two lines: the sample before and the sample after. That
; pair is the diff the whole probe is for. First sights and plain changes
; are written too, every one of them.
;   0  off
;   1  on
HoldWatch=1

; Cap on lost-or-regained holds written in full. 0 is no cap, and no cap is
; the setting: the world load spends any fixed one in seconds (200 went on
; streaming by 14:01:12 in one run and the pickup at 14:01:41 was never
; written). The summary reports calls, refusals, sub-objects, changes, holds
; lost and handler refusals either way.
HoldLines=0

; Cap on per-call lines for each automatic hook. 0 is no cap, and no cap is
; the setting; every call is written and counted.
Lines=0

; Actors whose class name contains this are traced by the hold watcher on
; every call, the way a marked actor is. The player character is a
; ServerChildOnlyInGameActor, a child of the ServerUserActor; nothing marks
; it before the pickup, and this has it in the log from the first frame.
; Empty turns it off.
TraceClass=ChildOnly

; Keep the catch through a map teleport. After moving the player (and, in
; the same call, whatever he is catching), the teleport handler calls slot
; 0x200 of his character-control component, which releases the catch
; through catch_update (reason 9) if the catch component holds one. That
; release sits behind a `je` over the call, and this makes the jump
; unconditional.
;
; There are four places that let go and all four are patched. The fourth is
; not on the teleport path. +0x20AE540 runs on the catch component itself
; and drops the catch unless the carry is still backed by the animation
; flags behind the actor's state object, which a teleport resets. It fired a
; second after the confirm in the 18:16 and 18:32 trials and cleared both
; sides at once. Its entry is a pair of branches and only the first one is
; on the path a live carry takes, so the patch goes at +0x20AE5C8, over the
; test of the held handle, and jumps to the same +0x20AE60E the function's
; own checks use. 0.9.4 patched the second branch instead and had no effect
; at all.
;
; The first three are copies of one function. The server's is
; +0x23290D0 with its branch at +0x2329124; the client's is a thunk at
; +0x860F90 to +0x99B6CB0 with its branch at +0x99B6D0F; the third is a
; client state transition at +0x156EF40, in no vtable, with its branch at
; +0x156F24D. Each one found the hard way, by a trial that ended with the
; outlaw on the ground: the server patch alone left the client letting go,
; and the first two left the third one to do it a second after the confirm.
; Before writing, each copy is checked: the two bytes of the branch, the
; call being skipped going to catch_update, the sixteen bytes of the test
; that decides it, and where there is one, the class's vtable slot. The
; bytes are logged before and after and restored on unload. 2.03.00.
;
; The saves are backed up before every trial (C:\working\cd mods\save-backups).
;   0  the teleport releases the catch, as shipped
;   1  the release is skipped
KeepCatch=1

; Keep the carried actor in the world through the teleport's departure
; sweep. At every map confirm a message handler (+0x10DC8D90) removes every
; actor the player's session spawned in the field it is leaving:
; +0x287DB30, then +0x287D440 over three lists of spawn records, then
; +0x2817E00 per record, which sends each of the record's actors out of the
; field (+0xE44B050, then the actor's virtual 0x110, where the catch is
; cleaned up). Before removing one it asks +0x1F53D10, a thunk to
; +0xE1478D0, whether anyone other than the record still holds the actor,
; and spares it on a yes. This hooks that check and answers yes for an
; actor whose own catch component says at +0x28 that it is being carried;
; every other actor gets the original answer. Needs KeepCatch=1: with the
; release in place the carried flag is gone before the sweep asks. Before
; hooking, the plugin checks the check's first bytes, that the thunk jumps
; to it and that the sweep's call reaches the thunk, and refuses otherwise.
; Every kept actor is written with who asked. 2.03.00.
;   0  the sweep removes the carried actor, as shipped
;   1  the carried actor is kept
KeepCarried=1

; Turn the refusals off.
;
; Each handler stores eErrNoFieldMoveHolding and returns, and one short
; conditional jump decides whether it reaches that store. This turns each of
; those jumps into an unconditional one. The plugin finds them itself, checks
; each is a short je or jne landing past its own error store, and refuses to
; write anything that is not; it logs the bytes before and after and restores
; them on unload. The polarity is not the same in all three, which is why it
; is read rather than assumed.
;
; Off by default, and worth leaving off for the first session. Removing the
; refusals makes the handlers run. It does not make the game re-create a
; carried target at the far end of a field move, and a field move is a full
; world unload: Glint Spotter's logs have client actors being freed within
; half a minute of a teleport. Back the save up before turning this on.
;   0  watch only
;   1  the handler that refuses stops refusing
Unblock=0

; Patch the other two handlers as well. Off. Session three caught +0x2BCD820
; refusing twice and neither of the two in .didata refused at all, while one
; of them ran 1,984 times in the same session. Rewriting a branch on a path
; that is taken constantly and has never been seen to refuse buys nothing and
; risks something.
;   0  only the handler that refuses
;   1  all three
UnblockAll=0

; Write every eErr name the plugin resolved, with its value, once at startup.
; That is 1,353 lines. Useful exactly once, when a code turns up that the
; table does not name and you want to see what it does hold.
;   0  off
;   1  on
DumpErrors=0

; ---------------------------------------------------------------------------
; Hooks.
;
; [resolve]  name = eErrSymbol [, options]
;   Hooks every function that raises that error, found at runtime by walking from
;   the name to its global, to the instructions reading the global, to the
;   functions containing them. One function keeps the name; several are numbered.
;   Nothing here breaks on a game update.
;
; [sites]    name = 0xRVA [, options]
;   Hooks an address. Everything below was read off 2.03.00 (exe 1.0.0.2944)
;   and every number is wrong on any other build. The plugin checks each one
;   is executable and refuses rather than patching into data.
;
; Options, shared by both:
;   out=N      argument N holds a pointer; read it back at return. On these
;              functions that is nearly always the eErr slot, and the log
;              names the code it finds.
;   onerr=1    say nothing per call; write a line only when that out pointer
;              comes back non-zero, carrying the arguments the entry saw.
;              This is what the busy sites run on: the field-move handler
;              runs 36,675 times in two and a half minutes and its successes
;              say nothing. Non-zero out values are counted for every site
;              whether or not this is set, and the summary reports the count
;              and the last code by name.
;   only=Name  per-call lines only for calls where one of the first `args`
;              arguments is an object whose class name contains Name. The
;              rest are counted and nothing else. For a function the world
;              load calls a thousand times about actors that are not the one
;              being carried.
;   mark=13    remember arguments 1 and 3 of every call that passes only=,
;              each with the object at its +8 when that has a class name (a
;              component's owner). Sixteen slots a session.
;   onlymarked=1  per-call lines only for calls where one of the first
;              `args` arguments is a remembered object, a component of one
;              (its +8), or a sub-object of one (the +8 of what its +0 points
;              to). Works with onerr=1: a marked call is written in full and
;              an unmarked one only when it errs. This is what tells the
;              outlaw's field move from the other 27,000.
;   marks=0xN  after every written call, dump every remembered object, N
;              bytes each: the player's catch component as it is at the
;              moment the outlaw is moved. Not on a per-frame site: the
;              15:26 run put it on the hold release, which runs every frame
;              for every traced actor, and the log grew at 160,000 lines a
;              second until the game could not finish a pickup.
;   args=N     how many of the six argument registers to print
;   obj=0xN    how many bytes of each pointer argument to dump, every call
;   retobj=0xN dump the object rax points at on return
;   lines=, dump=, errlines=, stack=N   caps on lines, dumps, error lines
;              and unwinds. None is set anywhere in this file and none should
;              be: a capped log is what cost sessions one to seven their
;              answers. Every written call gets its dumps and a 24-frame
;              unwind of its caller.
;   leave=0    no return hook, for a function that might throw through it
;   ret=, skip=, after=, a1= .. a4=   change what the function does; leave
;              them alone while the point is to find out what it does now
;
; [patch]    name = 0xRVA : hex bytes    written at startup, restored on unload
; [watch]    name = 0xRVA , length       logged at startup and on every change

[resolve]
; Two neighbours of the gate. Each raises a refusal a field move could also
; produce, and each has exactly one reader in the whole image, so both survive
; a game update.
sublevel   = eErrNoCantMoveSubLevel, out=2, args=4
movetype   = eErrCantMoveSomeWhereType, out=2, args=4

; The second gate. With the first one patched out, the same handler refuses
; again with eErrNoCantEnterToField, and no instruction inside +0x2BCD820
; raises it: a callee does, and the handler passes it up through the same out
; pointer. Four functions in the image raise it, at +0x2827CD0, +0x2AF8010,
; +0x2AF8660 and +0x10BB9790, so all four are hooked and the next session says
; which one answers.
enterfield = eErrNoCantEnterToField, out=2, args=4, onerr=1, obj=0x180

[sites]
; The catch machinery: what owns a carried bounty target. These errors are
; raised from several functions each, so they are addressed directly rather
; than resolved. 2.03.00 only.
;
; The names below were guesses from the disassembly until session one, where
; every hook logged the class of its first argument. Three were right and
; three were not, and the wrong ones are corrected here rather than left to
; mislead the next read of a log.
;
; catch_match   catcher and catchee matching. Runs on a Server or Client
;               CatchActorComponent, twice at the pickup. The server call has
;               the player's ServerCatchActorComponent in rcx and the outlaw
;               in r8, the client call the client pair, and it marks all of
;               them (and each component's owner, so the player too); every
;               onlymarked site below follows them from there. catch_able
;               does not mark, because the destination re-catch calls it
;               about NPCs and their props.
; catch_able    the catchability test, on the same component, twelve times.
; catch_update  on the same component, 4,209 times a session. The field-move
;               handler calls it with mode 2 to release a companion's catch
;               before moving the companion along, so it is a release among
;               other things; the ini hears about it only on the player's
;               component or with the outlaw as an argument.
; actor_spawn   generic actor creation, taking an ICreateServerActorDesc. Not
;               catch-specific, but it is the path a CatchSpawn actor would
;               come through, which is the question a teleport raises.
catch_match  = 0x20ABAE0, out=2, args=4, obj=0x180, mark=13
catch_able   = 0x20AC2D0, out=2, args=4, obj=0x180
catch_update = 0x20AD3A0, out=2, args=4, onerr=1, onlymarked=1, obj=0x180
actor_spawn  = 0x2792F80, out=2, args=4, obj=0x180

; The rest of the catch component. Nothing hooked fired in the second the
; outlaw was released at the map confirm, so whichever method of the
; player's ServerCatchActorComponent did it was not one of the three above.
; These are every other function beside them in the file (+0x20AA000 to
; +0x20AF000, where a class's methods sit together) and every own entry of
; the ServerCatchActorComponent vtable at +0x5B35100, less the shared base
; helpers. All quiet except about a marked object or a component of one,
; so the client-side component (marked by the second catch_match call) is
; followed too. Named by address because none has a name yet; the log's
; class and argument columns will give them one.
cm_20AA090 = 0x20AA090, args=4, onlymarked=1, obj=0x180
cm_20AA140 = 0x20AA140, args=4, onlymarked=1, obj=0x180
cm_20AA320 = 0x20AA320, args=4, onlymarked=1, obj=0x180
cm_20AA3A0 = 0x20AA3A0, args=4, onlymarked=1, obj=0x180
cm_20AA440 = 0x20AA440, args=4, onlymarked=1, obj=0x180
cm_20AA460 = 0x20AA460, args=4, onlymarked=1, obj=0x180
cm_20AA5D0 = 0x20AA5D0, args=4, onlymarked=1, obj=0x180
cm_20AA770 = 0x20AA770, args=4, onlymarked=1, obj=0x180
cm_20AA8B0 = 0x20AA8B0, args=4, onlymarked=1, obj=0x180
cm_20AAA50 = 0x20AAA50, args=4, onlymarked=1, obj=0x180
cm_20AAB90 = 0x20AAB90, args=4, onlymarked=1, obj=0x180
cm_20AAD20 = 0x20AAD20, args=4, onlymarked=1, obj=0x180
cm_20AAE60 = 0x20AAE60, args=4, onlymarked=1, obj=0x180
cm_20AB080 = 0x20AB080, args=4, onlymarked=1, obj=0x180
cm_20AB460 = 0x20AB460, args=4, onlymarked=1, obj=0x180
cm_20ABA10 = 0x20ABA10, args=4, onlymarked=1, obj=0x180
cm_20ACB90 = 0x20ACB90, args=4, onlymarked=1, obj=0x180
cm_20AE2B0 = 0x20AE2B0, args=4, onlymarked=1, obj=0x180
cm_20AE540 = 0x20AE540, args=4, onlymarked=1, obj=0x180
cm_20AE700 = 0x20AE700, args=4, onlymarked=1, obj=0x180
cm_20AE9C0 = 0x20AE9C0, args=4, onlymarked=1, obj=0x180
cv_2C4C700 = 0x2C4C700, args=4, onlymarked=1, obj=0x180
cv_2C4C770 = 0x2C4C770, args=4, onlymarked=1, obj=0x180
cv_2C4D1F0 = 0x2C4D1F0, args=4, onlymarked=1, obj=0x180
cv_2C4C8F0 = 0x2C4C8F0, args=4, onlymarked=1, obj=0x180
cv_2C4CB90 = 0x2C4CB90, args=4, onlymarked=1, obj=0x180
cv_2C4CC70 = 0x2C4CC70, args=4, onlymarked=1, obj=0x180
cv_2C4CED0 = 0x2C4CED0, args=4, onlymarked=1, obj=0x180
cv_2C4CFC0 = 0x2C4CFC0, args=4, onlymarked=1, obj=0x180
cv_2C4D0C0 = 0x2C4D0C0, args=4, onlymarked=1, obj=0x180
cv_20AADA0 = 0x20AADA0, args=4, onlymarked=1, obj=0x180
cv_20AB380 = 0x20AB380, args=4, onlymarked=1, obj=0x180
cv_20AB440 = 0x20AB440, args=4, onlymarked=1, obj=0x180
cv_20AB8E0 = 0x20AB8E0, args=4, onlymarked=1, obj=0x180
cv_20AE3C0 = 0x20AE3C0, args=4, onlymarked=1, obj=0x180
cv_24049C0 = 0x24049C0, args=4, onlymarked=1, obj=0x180

; The lookup behind the second gate. +0x2AF8010 calls this and stores
; eErrNoCantEnterToField when it returns nothing, so the failure is the
; return value and no error code is written anywhere. onnull catches it
; with the arguments it was given. 2.03.00 only.
fieldlookup  = 0x2AF99D0, args=2, onnull=1, obj=0x100

; Every picked-up object in the game goes through this, bounty target or
; not. On for session seven because the glitch is two pickups of the same
; body, and whether the second one comes through here or through the catch
; functions above is the first thing to know about it.
catch_gimmick = 0x211FA30, out=2, args=4, obj=0x180

; The two functions that write the field-attach sub-object's blocked byte to
; something other than zero (2 and 3). Neither is called from the catch
; code; both sit with the field-move machinery, so they should fire around
; the teleport that succeeds and say what the sub-object goes through. Their
; first argument is the sub-object, which holdwatch names by address.
; attach_release is the per-frame release, 509,848 calls in session seven's
; first run, and the one that would have taken the outlaw's field away at
; the map confirm; it is heard only about a marked actor's sub-object.
attach_release = 0x2BBF0C0, args=2, onlymarked=1, obj=0x80
attach_state3  = 0x2BBFA00, args=2, obj=0x80

; The loop that brings attached actors along on a teleport, read off the
; stack under the 14:02:02 refusal. +0x10BBA080 walks an array of actors
; and, for each: +0x2AFA090 prepares it, +0x2792F80 (actor_spawn, above)
; creates it at the destination, then +0x2AFE180 places it, which reaches
; +0x105E8B10 (a rider or vehicle path: it raises eErrNoIsNotVehicle) and
; from there the field-move handler for the child, which refuses because
; the fresh child holds no field yet. All four run only on a field move.
fm_children = 0x10BBA080, out=2, args=4, obj=0x100
fm_prepare  = 0x2AFA090,  out=2, args=4, obj=0x180
fm_place    = 0x2AFE180,  out=2, args=4, obj=0x100
fm_rider    = 0x105E8B10, out=2, args=4, obj=0x100

; The destination re-catch. In both runs so far, two seconds after the
; teleport's reload, +0x105EE940 built a catch request from a block saved at
; owner+0x460 and asked catch_able about a brand-new component and actor,
; got a yes, and nothing followed: no catch_match, no body. What it does
; after the yes is the open question, and this runs once per teleport.
recatch = 0x105EE940, out=2, args=4, obj=0x4A0

; The other half, settled in session eight's log. +0x2793C20 adds a
; CreateChildServerActorDesc_CatchTarget to a parent's spawn descriptor and
; ran once in the session: from cd_caller1, for an NPC whose actor-info row
; has a "catchspawn" block at +0x480, which is spawn data saying the NPC is
; born carrying a prop. cd_caller1 runs for every actor placed (2,814
; times), builds the prop's descriptor and the catch preset when the block
; is there, and the destination re-catch spawns that prop into the NPC's
; hands. The player is never placed by the reload (two actor_spawn calls
; for his class, both at the first load), so none of this can apply to him.
; Kept on because the reload is still the loudest thing in a teleport and
; the counts say whether it changed.
catch_childdesc = 0x2793C20, out=2, args=3, obj=0x400
cd_caller1 = 0x2798CF0, out=2, args=4, obj=0x200
cd_caller2 = 0x288C0C0, out=2, args=4, obj=0x200
cd_caller3 = 0x288CCA0, out=2, args=4, obj=0x200

; Inside the field-move handler +0x2BCD820, read off its disassembly. For an
; actor of kind 1 whose last move was more than three seconds ago, the
; handler lists the actors in its company (fm_company, on the component at
; +0x108 of the actor's table) and, for each one farther than a threshold
; from the destination: releases that one's catch if its catch component
; holds one (catch_update, mode 2), tells its owner (fm_company_rel, which
; carries eErr +0x6CF70CC) and moves it to the destination (fm_company_mv).
; That is the game's own "bring your company along", and it drops what the
; company carries before moving them. For the actor itself the handler then
; runs fm_step1 and fm_step2 on the component, writes the transform, and
; runs fm_step3 with the request; fm_notify sends the move to the client.
; All quiet unless a marked actor, or a component of one, is in the
; arguments. The handler itself runs six or seven times a second for the
; player while he moves, so its family here is the everyday move path as
; well as the teleport; the teleport is the one whose request has a far
; destination. The request struct the handler gets in r8 has the destination
; at +0, the rotation at +0xC, a flag at +0x1C, matrices from +0x48, a byte
; at +0xD0 and a pointer at +0xD8; fieldmove1's dump of r8 has all of it.
fm_company     = 0x21D8920, args=2, onlymarked=1, obj=0x100, marks=0x180
fm_company_mv  = 0x2BCD0A0, args=3, onlymarked=1, obj=0x100, marks=0x180
fm_company_rel = 0x29652A0, args=4, onlymarked=1, obj=0x100, marks=0x180
fm_step1       = 0x2BC3B20, args=1, onlymarked=1, obj=0x400
fm_step2       = 0x219BB80, args=1, onlymarked=1, obj=0x400
fm_step3       = 0x21A0330, args=2, onlymarked=1, obj=0x400
fm_notify      = 0x2974B80, args=4, onlymarked=1, obj=0x100, marks=0x180

; The departure sweep, session ten. sweep is the message handler's call,
; once per message and about seventy messages per confirm; sweep_lists is
; the walk over the session's three spawn-record lists; sweep_record runs
; once per record it removes, with the record in rcx (its actors are
; 0x168-byte entries from +0x138, count at +0x140) and the held field in
; rdx; leave_field is the per-actor removal, written only for a marked
; actor, with the actor in rcx and the reason byte in r8. With KeepCarried
; the outlaw should be in a keepcarried line instead of a leave_field one.
; The object the sweep runs on has a name from the 16:26 run: it is a
; ServerSequencerStageManager, the thing that spawns a quest stage's
; actors, which is what a bounty outlaw is. It also runs every five seconds
; outside a teleport, so most of its calls have nothing to do with a
; teleport.
sweep       = 0x287DB30, args=4, obj=0x100
sweep_lists = 0x287D440, args=3, obj=0x180
sweep_record = 0x2817E00, out=2, args=4, obj=0x180
leave_field = 0xE44B050, args=4, onlymarked=1, obj=0x100

